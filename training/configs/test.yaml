data:
  train_path: ../test_data/train_mini.json
  dev_path: ../test_data/dev_mini.json
  max_seq_length: 128

model:
  model_name: cointegrated/rubert-tiny2
  num_labels: 1

training:
  batch_size: 2
  learning_rate: 2e-5
  num_epochs: 1
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  eval_strategy: steps
  eval_steps: 2
  save_strategy: steps
  save_steps: 2
  save_total_limit: 1
  output_dir: test_output
  seed: 42
  fp16: false
  bf16: false
  load_best_model_at_end: true
  metric_for_best_model: eval_evaluator
  logging_steps: 1
