[project]
name = "offers-reranker-inference"
version = "0.1.0"
description = "Inference service for offers reranker cross-encoder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3,<0.7.4",
    "mosec>=0.9.5,<0.9.6",
    "msgpack>=1.1.2,<1.2.0",
    "msgspec>=0.19.0,<0.19.1",
    "pydantic>=2.12.3,<2.13.0",
    "pydantic-settings>=2.11.0,<2.12.0",
    "python-dotenv>=1.2.1,<1.3.0",
    "sentence-transformers>=5.1.2,<5.2.0",
]


[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "mypy>=1.18.2,<1.19.0",
    "pytest>=8.4.2,<8.5.0",
    "ruff>=0.14.3,<0.14.4",
    "types-requests>=2.32.4.20250913,<2.33.0.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_redundant_casts = true
warn_unreachable = true

plugins = ["pydantic.mypy"]

mypy_path = "."
explicit_package_bases = true

[tool.pydantic.mypy]
init_forbid_extra = true
init_typed = true
