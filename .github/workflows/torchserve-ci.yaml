name: TorchServe CI

on:
  pull_request:
    paths:
      - 'inference-torchserve/**'
      - '.github/workflows/torchserve-ci.yaml'
      - '.github/workflows/reusable-ci.yaml'

jobs:
  inference-ci:
    name: Code, Typing & Linting
    uses: ./.github/workflows/reusable-ci.yaml
    with:
      working-directory: ./inference-torchserve
      python-version: '3.12'
      run-tests: true
      run-mypy: true
      run-ruff: true

  docker-build-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./inference-torchserve
    
    steps:
      - name: Free up disk space
        working-directory: .
        run: |
          echo "Disk space before cleanup:"
          df -h
          # Remove unnecessary large packages (frees ~30GB+)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/.ghcup
          # Clean Docker
          sudo docker system prune -af --volumes
          # Clean apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"
          enable-cache: true
          cache-dependency-glob: "./inference-torchserve/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --no-install-project
        env:
          UV_CACHE_DIR: /tmp/uv-cache

      - name: Create dummy model for testing
        run: |
          echo "Creating dummy model for CI testing..."
          uv run python scripts/create_dummy_model.py --output-dir ../models/dummy-model
          ls -la ../models/dummy-model/

      - name: Package model with dummy data
        run: |
          echo "Packaging dummy model..."
          chmod +x scripts/package_model.sh
          MODEL_PATH="../models/dummy-model" ./scripts/package_model.sh
          ls -la model-store/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./inference-torchserve
          push: false
          load: true
          tags: torchserve-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container startup
        run: |
          echo "Starting container for smoke test..."
          docker run -d --name torchserve-test -p 8080:8080 -p 8081:8081 -p 8082:8082 torchserve-test:latest
          
          echo "Waiting for container to start..."
          sleep 30
          
          echo "Checking container status..."
          docker logs torchserve-test
          
          # Check if container is still running
          if ! docker ps | grep torchserve-test; then
            echo "Container failed to stay running"
            exit 1
          fi
          
          echo "Testing health endpoints..."
          # Test ping endpoint
          curl -f http://localhost:8080/ping || (echo "Ping endpoint failed"; exit 1)
          
          # Test management API
          curl -f http://localhost:8081/models || (echo "Management API failed"; exit 1)
          
          echo "All smoke tests passed!"

      - name: Cleanup
        if: always()
        run: |
          docker stop torchserve-test || true
          docker rm torchserve-test || true

