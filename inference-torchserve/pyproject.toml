[project]
name = "offers-reranker-torchserve"
version = "0.1.0"
description = "TorchServe inference service for offers reranker cross-encoder"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "sentence-transformers>=5.1.2,<5.2.0",
    "torch>=2.0.0,<3.0.0",
    "torchserve>=0.12.0,<0.13.0",
    "torch-model-archiver>=0.12.0,<0.13.0",
]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "mypy>=1.18.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.14.0,<0.15.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_redundant_casts = true
warn_unreachable = true

mypy_path = "."
explicit_package_bases = true

